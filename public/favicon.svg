<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b0618" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e024e0" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="3" />
  
  <!-- High Contrast Pulse Waveform & Rocket Arrow -->
  <g filter="url(#glow)">
    <path
      d="M 18 52 L 32 52 L 40 76 L 48 30 L 56 58 L 65 38 L 78 20"
      fill="none"
      stroke="url(#pulseGrad)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Arrow Peak -->
    <path
      d="M 62 20 L 80 18 L 78 36 Z"
      fill="#06b6d4"
      stroke="#06b6d4"
      stroke-width="2"
      stroke-linejoin="round"
    />
  </g>
</svg>
